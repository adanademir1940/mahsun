<style>
  :root{
    --bg:#0c0a09; --card:rgba(255,255,255,.04); --card-h:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.09); --text:#fafaf9; --muted:#a8a29e; --gold:#d6a85c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:Inter,system-ui,-apple-system,sans-serif; line-height:1.5;
    display:flex; align-items:center;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(214,168,92,.18), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 110%, rgba(214,168,92,.07), transparent 70%);
    background-attachment:fixed;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.05; z-index:0;
    background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  main{position:relative; z-index:1; width:100%; max-width:440px; margin:0 auto; padding:48px 16px}

  /* Üst kısım: hareketli aurora kart + iki satırlı modern isim */
  header{
    position:relative; overflow:hidden; isolation:isolate; text-align:center;
    padding:40px 20px 38px; border-radius:28px;
    background:#13100d; border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 60px -30px rgba(214,168,92,.45);
    animation:rise .7s ease both;
  }
  header::before,header::after{
    content:""; position:absolute; z-index:-1; border-radius:50%; filter:blur(40px); opacity:.55;
  }
  header::before{width:220px; height:220px; left:-60px; top:-90px; background:#d6a85c; animation:drift1 9s ease-in-out infinite alternate}
  header::after{width:200px; height:200px; right:-70px; bottom:-110px; background:#b4532a; animation:drift2 11s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(90px,50px) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-80px,-40px) scale(1.2)}}
  /* ince ızgara dokusu */
  header .grid{
    position:absolute; inset:0; z-index:-1; opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:22px 22px;
    -webkit-mask:radial-gradient(ellipse at center,#000 30%,transparent 75%); mask:radial-gradient(ellipse at center,#000 30%,transparent 75%);
  }
  h1{
    font-family:Unbounded,Inter,system-ui,sans-serif; font-weight:700; text-transform:uppercase;
    font-size:clamp(2rem,10.5vw,2.9rem); line-height:.98; letter-spacing:-.02em;
  }
  h1 span{display:block}
  h1 .first{
    background:linear-gradient(100deg,#fff 0%,#fff 40%,#f3d9a4 50%,#fff 60%,#fff 100%);
    background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 5s ease-in-out infinite;
  }
  h1 .last{margin-top:6px; font-weight:500; letter-spacing:.06em; background:linear-gradient(180deg,#f3d9a4,#c8913f); -webkit-background-clip:text; background-clip:text; color:transparent}
  @keyframes shine{0%,40%{background-position:100% 0} 70%,100%{background-position:0 0}}
  .links{display:grid; gap:12px; margin-top:36px}
  .link{
    display:flex; align-items:center; gap:14px; min-height:60px; padding:12px 18px;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    color:var(--text); text-decoration:none; font-weight:500; font-size:.98rem;
    transition:background .2s, border-color .2s, transform .2s;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    animation:rise .6s ease both;
  }
  .link:hover{background:var(--card-h); border-color:rgba(214,168,92,.45); transform:translateY(-2px)}
  .link:active{transform:scale(.98)}
  /* Marka renkli ikon kutuları */
  .ic{width:40px; height:40px; flex:none; border-radius:12px; display:grid; place-items:center; background:var(--c); color:#fff}
  .ic svg{width:22px; height:22px}
  .link{--c:var(--gold)}
  .link:hover{border-color:color-mix(in srgb,var(--c) 70%,transparent); box-shadow:0 10px 30px -12px color-mix(in srgb,var(--c) 60%,transparent)}
  .ig{--c:#E1306C} .ig .ic{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
  .yt{--c:#FF0033}
  .tt{--c:#FE2C55} .tt .ic{background:#000; border:1px solid rgba(255,255,255,.12)} .tt .ic svg{filter:drop-shadow(-1.5px -1px 0 #25F4EE) drop-shadow(1.5px 1px 0 #FE2C55)}
  .xx{--c:#e7e9ea} .xx .ic{background:#000; border:1px solid rgba(255,255,255,.18)}
  .fb{--c:#1877F2}
  .imdb{--c:#F5C518} .imdb .ic{color:#000}
  .mail{--c:#d6a85c} .mail .ic{color:#1c1405}
  .link .t{flex:1}
  .link .t small{display:block; color:var(--muted); font-weight:400; font-size:.78rem}
  .link .arrow{width:16px; height:16px; color:var(--muted)}

  footer{margin-top:40px; text-align:center; color:#57534e; font-size:.75rem; letter-spacing:.04em}

  @keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  .links .link:nth-child(1){animation-delay:.10s} .links .link:nth-child(2){animation-delay:.16s}
  .links .link:nth-child(3){animation-delay:.22s} .links .link:nth-child(4){animation-delay:.28s}
  .links .link:nth-child(5){animation-delay:.34s} .links .link:nth-child(6){animation-delay:.40s} .links .link:nth-child(7){animation-delay:.46s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
